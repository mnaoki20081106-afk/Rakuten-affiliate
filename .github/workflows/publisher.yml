# このファイルは src/batch_generator.py によって自動生成されます。手動で編集しないでください。
# 対象日 (JST): (未生成) / パート 1/1
# 生成日時 (UTC): (バッチ未実行)
# cron 登録数: 0 (上限 60/ファイル)
name: Publisher

on:
  workflow_dispatch:
  # 配信予定がないため schedule は登録されていません

concurrency:
  group: publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Publish scheduled posts
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m src.publisher
      - name: Commit & push state
        run: 'bash scripts/commit_and_push.sh "chore: publish scheduled posts"'
