name: repost_job

# 【再投稿機能】過去 1 週間でいいねが多かった上位 3 件を再投稿
# 月・水・金の JST 19:00 = UTC 10:00 に起動する
on:
  schedule:
    - cron: "0 10 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "送信せず候補だけ表示する"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: data-store
  cancel-in-progress: false

jobs:
  repost:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 過去バズ投稿を再配信
        env:
          # 方法A: アカウントを増やしたらこの行を増やす（THREADS_TOKEN_<アカウントID大文字>）
          THREADS_TOKEN_BEAUTY: ${{ secrets.THREADS_TOKEN_BEAUTY }}
          THREADS_TOKEN_LIVING: ${{ secrets.THREADS_TOKEN_LIVING }}
          # 方法B: 1 つの Secret にまとめる場合（例: {"beauty": "THAA...", "living": "THAA..."}）
          THREADS_TOKENS_JSON: ${{ secrets.THREADS_TOKENS_JSON }}
          PR_REPLY_TEMPLATE: ${{ vars.PR_REPLY_TEMPLATE }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${DRY_RUN:-false}" = "true" ]; then
            python -m src.reposter --dry-run
          else
            python -m src.reposter
          fi

      - name: 差分をコミット・プッシュ
        run: |
          bash .github/scripts/commit_data.sh "chore(repost): 再投稿結果を反映"
