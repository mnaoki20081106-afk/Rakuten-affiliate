name: batch_job

# 【前日バッチ処理】リサーチ・生成・スケジュール予約
# JST 23:00 = UTC 14:00 に起動する
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      account:
        description: "処理するアカウント ID（空欄なら全アカウント）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # 3 つのワークフローが同時に data/*.json を書き換えないよう直列化する
  group: data-store
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 翌日分のリサーチ・生成・スケジュール予約
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          ACCOUNT_ID: ${{ inputs.account }}
        run: |
          if [ -n "${ACCOUNT_ID:-}" ]; then
            python -m src.batch_generator --account "$ACCOUNT_ID"
          else
            python -m src.batch_generator
          fi

      - name: 差分をコミット・プッシュ
        run: |
          bash .github/scripts/commit_data.sh "chore(batch): 翌日分の配信キューを生成"
